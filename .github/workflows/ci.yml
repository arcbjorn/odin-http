name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # The TLS backend links against OpenSSL 3.x. Linux resolves `system:ssl`,
      # macOS names the Homebrew path directly because Apple removed libssl.
      - name: Install OpenSSL (linux)
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Install OpenSSL (macos)
        if: matrix.name == 'macos'
        run: brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          # Pinned so a compiler change cannot silently break the build; bump
          # deliberately. This matches the version the suite is developed on.
          release: dev-2026-07a
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: odin check http -no-entry-point

      - name: Test
        run: odin test tests

      # A test count in prose drifts on every commit that adds one, and a
      # README overstating coverage is worse than one that omits it.
      # Mutation testing disables a guard, runs the suite, then restores it. An
      # interrupted run leaves the check switched off in a form that reads as
      # ordinary source.
      - name: Check for leftover mutations
        run: ./scripts/check_no_stubs.sh

      - name: Check README claims
        run: ./scripts/check_readme.sh

      # The quickstart is the first code a user runs; if it stops compiling
      # against the package it documents, that is a defect.
      - name: Compile README quickstart
        run: ./scripts/check_examples.sh

      # Building an example does not prove it serves: a wrong port or an
      # unregistered route compiles cleanly and fails the first user.
      - name: Run examples
        run: ./scripts/check_examples_run.sh

      # TLS and h2-over-ALPN have no unit coverage — OpenSSL is linked at build
      # time and there is no FFI to generate a certificate — so the only way to
      # catch an ALPN regression is to negotiate one with a real client.
      - name: Verify TLS and ALPN
        run: ./scripts/check_tls.sh

      # The library is thread-per-connection with shared server state, so a
      # data race is a bug class that ordinary tests cannot see. TSan exits
      # non-zero on any race, which fails the job.
      # The suppression file covers `core:mem/virtual`'s page allocator, which
      # TSan flags on Linux when two connection threads each initialise their
      # own arena. See tsan.supp for why that is not a race in this library.
      - name: Test under ThreadSanitizer
        run: odin test tests -sanitize:thread
        env:
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/tsan.supp

      - name: Build examples
        run: |
          for dir in examples/*/; do
            echo "building $dir"
            odin build "$dir" -out:/tmp/example-bin
          done
