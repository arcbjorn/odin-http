<svg xmlns="http://www.w3.org/2000/svg" color="#0f172a" viewBox="0 0 760 400" width="760" height="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <style>
    .box  { fill:#ffffff; stroke:#334155; stroke-width:1.5; rx:6 }
    .core { fill:#eff6ff; stroke:#2563eb; stroke-width:1.75; rx:6 }
    .io   { fill:#fef3c7; stroke:#b45309; stroke-width:1.5; rx:6 }
    .title{ fill:#0f172a }
    .t    { font-size:13px; fill:#0f172a }
    .tb   { font-size:13px; fill:#0f172a; font-weight:600 }
    .s    { font-size:11px; fill:#475569 }
    .lbl  { font-size:11px; fill:#64748b; font-style:italic }
    .ar   { stroke:#475569; stroke-width:1.4; fill:none; marker-end:url(#a) }
    @media (prefers-color-scheme: dark) {
      svg { color:#e2e8f0 }
      .box  { fill:#1e293b; stroke:#94a3b8 }
      .core { fill:#1e3a5f; stroke:#60a5fa }
      .io   { fill:#422006; stroke:#fbbf24 }
      .t,.tb { fill:#e2e8f0 }
      .s,.lbl { fill:#94a3b8 }
      .ar   { stroke:#94a3b8 }
      .title { fill:#e2e8f0 }
    }
    :root[data-theme="dark"] .box  { fill:#1e293b; stroke:#94a3b8 }
    :root[data-theme="dark"] .core { fill:#1e3a5f; stroke:#60a5fa }
    :root[data-theme="dark"] .io   { fill:#422006; stroke:#fbbf24 }
    :root[data-theme="dark"] .t,
    :root[data-theme="dark"] .tb   { fill:#e2e8f0 }
    :root[data-theme="dark"] .s,
    :root[data-theme="dark"] .lbl  { fill:#94a3b8 }
    :root[data-theme="dark"] .ar   { stroke:#94a3b8 }
    :root[data-theme="dark"] svg { color:#e2e8f0 }
    :root[data-theme="light"] .box  { fill:#ffffff; stroke:#334155 }
    :root[data-theme="light"] .core { fill:#eff6ff; stroke:#2563eb }
    :root[data-theme="light"] .io   { fill:#fef3c7; stroke:#b45309 }
    :root[data-theme="light"] .t,
    :root[data-theme="light"] .tb   { fill:#0f172a }
    :root[data-theme="light"] .s,
    :root[data-theme="light"] .lbl  { fill:#475569 }
    :root[data-theme="light"] .ar   { stroke:#475569 }
    :root[data-theme="light"] svg { color:#0f172a }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="20" y="26" font-size="15" font-weight="700" fill="currentColor">Architecture</text>
  <text x="20" y="44" class="s">Protocol logic never touches a socket. Everything blue is sans-I/O and tested without one.</text>

  <!-- socket layer -->
  <rect class="io" x="20" y="70" width="150" height="54"/>
  <text x="95" y="92" class="tb" text-anchor="middle">Socket</text>
  <text x="95" y="110" class="s" text-anchor="middle">core:net</text>

  <rect class="io" x="20" y="150" width="150" height="66"/>
  <text x="95" y="172" class="tb" text-anchor="middle">Transport</text>
  <text x="95" y="189" class="s" text-anchor="middle">read / write / close</text>
  <text x="95" y="205" class="s" text-anchor="middle">plain · TLS · in-memory</text>

  <!-- drivers -->
  <rect class="box" x="230" y="70" width="180" height="66"/>
  <text x="320" y="92" class="tb" text-anchor="middle">HTTP/1.1 driver</text>
  <text x="320" y="109" class="s" text-anchor="middle">thread per connection</text>
  <text x="320" y="125" class="s" text-anchor="middle">keep-alive · pipelining</text>

  <rect class="box" x="230" y="150" width="180" height="66"/>
  <text x="320" y="172" class="tb" text-anchor="middle">HTTP/2 driver</text>
  <text x="320" y="189" class="s" text-anchor="middle">frame demux → streams</text>
  <text x="320" y="205" class="s" text-anchor="middle">flow control · multiplexing</text>

  <!-- sans-io core -->
  <rect class="core" x="470" y="70" width="130" height="52"/>
  <text x="535" y="91" class="tb" text-anchor="middle">Parser</text>
  <text x="535" y="108" class="s" text-anchor="middle">req + resp</text>

  <rect class="core" x="620" y="70" width="120" height="52"/>
  <text x="680" y="91" class="tb" text-anchor="middle">HPACK</text>
  <text x="680" y="108" class="s" text-anchor="middle">RFC 7541</text>

  <rect class="core" x="470" y="140" width="130" height="52"/>
  <text x="535" y="161" class="tb" text-anchor="middle">Frames</text>
  <text x="535" y="178" class="s" text-anchor="middle">RFC 9113 §4,6</text>

  <rect class="core" x="620" y="140" width="120" height="52"/>
  <text x="680" y="161" class="tb" text-anchor="middle">Streams</text>
  <text x="680" y="178" class="s" text-anchor="middle">state + windows</text>

  <!-- handler layer -->
  <rect class="box" x="230" y="255" width="510" height="60"/>
  <text x="485" y="278" class="tb" text-anchor="middle">Router → Middleware → Handler</text>
  <text x="485" y="298" class="s" text-anchor="middle">one Handler type, identical on both protocols</text>

  <rect class="box" x="230" y="336" width="160" height="54"/>
  <text x="310" y="357" class="tb" text-anchor="middle">Buffered</text>
  <text x="310" y="374" class="s" text-anchor="middle">res.body</text>

  <rect class="box" x="405" y="336" width="160" height="54"/>
  <text x="485" y="357" class="tb" text-anchor="middle">File</text>
  <text x="485" y="374" class="s" text-anchor="middle">streamed, bounded</text>

  <rect class="box" x="580" y="336" width="160" height="54"/>
  <text x="660" y="357" class="tb" text-anchor="middle">Callback</text>
  <text x="660" y="374" class="s" text-anchor="middle">chunked / DATA</text>

  <path class="ar" d="M95,124 L95,150"/>
  <path class="ar" d="M170,100 L228,100"/>
  <path class="ar" d="M170,183 L228,183"/>
  <path class="ar" d="M410,96 L468,96"/>
  <path class="ar" d="M410,176 L468,166"/>
  <path class="ar" d="M600,96 L618,96"/>
  <path class="ar" d="M600,166 L618,166"/>
  <path class="ar" d="M320,136 L320,150" stroke-dasharray="3 3"/>
  <path class="ar" d="M320,216 L320,253"/>
  <path class="ar" d="M485,315 L485,334"/>
  <text x="185" y="240" class="lbl">ALPN selects the driver</text>
</svg>
